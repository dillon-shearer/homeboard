server {
    listen 80 default_server;
    listen [::]:80 default_server;
    include snippets/homeboard-proxy.conf;
    error_page 502 503 504 /homeboard-offline.html;
    location = /homeboard-offline.html {
        internal;
        alias /opt/homeboard/deploy/splash/boot.html;
        add_header Cache-Control "no-store" always;
        sub_filter '<span id="label">Starting Home Board...</span>' '<span id="label">Home Board is restarting...</span>';
    }
    location = /boot.html {
        alias /opt/homeboard/deploy/splash/boot.html;
        add_header Cache-Control "no-store" always;
    }
}
