server {
    listen 127.0.0.1:80;
    listen [::1]:80;
    include snippets/homeboard-proxy.conf;
    error_page 502 503 504 /homeboard-offline.html;
    location = /homeboard-offline.html {
        internal;
        alias /opt/homeboard/deploy/splash/boot.html;
        add_header Cache-Control "no-store" always;
        sub_filter '<span id="label">Starting Home Board...</span>' '<span id="label">Home Board is restarting...</span>';
    }
    location = /boot.html {
        alias /opt/homeboard/deploy/splash/boot.html;
        add_header Cache-Control "no-store" always;
    }
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    access_log off;
    return 301 https://__HOST__$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name __HOST__;
    ssl_certificate /etc/letsencrypt/live/__HOST__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__HOST__/privkey.pem;
    include snippets/homeboard-proxy.conf;
    error_page 502 503 504 /homeboard-offline.html;
    location = /homeboard-offline.html {
        internal;
        alias /opt/homeboard/deploy/splash/boot.html;
        add_header Cache-Control "no-store" always;
        sub_filter '<span id="label">Starting Home Board...</span>' '<span id="label">Home Board is restarting...</span>';
    }
}
