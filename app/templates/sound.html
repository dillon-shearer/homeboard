<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#008080">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Home Board">
<title>Sound - Home Board</title>
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icon-512.png">
<link rel="icon" type="image/png" href="/static/icon-512.png">
<link rel="stylesheet" href="{{ static_url('win95.css') }}">
<link rel="stylesheet" href="{{ static_url('admin.css') }}">
<link rel="stylesheet" href="{{ static_url('sound.css') }}">
</head>
<body class="w95-desktop">
<main class="w95-window">
<div class="w95-titlebar">
<a class="w95-back" href="/admin">Start</a>
<span class="w95-title-text">Sound</span>
<a class="title-close" href="/admin" aria-label="Close"><span class="w95-close" aria-hidden="true"></span></a>
</div>
<div class="w95-body">
<section class="w95-group settings" aria-labelledby="group-spotify">
<h2 id="group-spotify" class="w95-legend">Spotify</h2>
<p id="spotify-state" class="sound-line">Checking...</p>
<p id="not-linked" class="sound-line" hidden>Spotify is not linked. <a href="/admin/settings">Link it in Settings</a></p>
<div id="player"></div>
<p id="player-note" class="error" hidden></p>
</section>
<section id="speaker-group" class="w95-group settings" aria-labelledby="group-speaker" hidden>
<h2 id="group-speaker" class="w95-legend">Speaker</h2>
<div class="w95-row player-speaker">
<p id="speaker-state" class="sound-line">Checking...</p>
<button id="speaker-toggle" class="w95-btn" type="button" disabled>Connect</button>
</div>
</section>
<section id="playlists-group" class="w95-group settings" aria-labelledby="group-playlists" hidden>
<h2 id="group-playlists" class="w95-legend">Playlists</h2>
<ul id="board-playlists" class="player-tiles"></ul>
<p id="playlists-none" class="sound-line" hidden>No playlists are shown on the board. Pick some in <a href="/admin/settings">Settings</a>.</p>
</section>
</div>
</main>

<script src="{{ static_url('player.js') }}"></script>
<script src="{{ static_url('sound.js') }}"></script>
</body>
</html>
