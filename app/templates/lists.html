<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#008080">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Home Board">
<title>Lists - Home Board</title>
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icon-512.png">
<link rel="icon" type="image/png" href="/static/icon-512.png">
<link rel="stylesheet" href="{{ static_url('win95.css') }}">
<link rel="stylesheet" href="{{ static_url('admin.css') }}">
<link rel="stylesheet" href="{{ static_url('lists.css') }}">
</head>
<body class="w95-desktop">
<div id="toast" class="toast w95-window" role="alert" hidden>
<div class="w95-titlebar"><span class="w95-title-text">Home Board</span></div>
<div class="toast-body">
<svg class="toast-icon" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13" fill="#000"/><circle cx="15" cy="15" r="13" fill="#ff0000"/><path d="M10 10l10 10M20 10L10 20" stroke="#fff" stroke-width="3"/></svg>
<span id="toast-text"></span>
</div>
</div>
<main class="w95-window">
<div class="w95-titlebar">
<a class="w95-back" href="/admin">Start</a>
<span class="w95-title-text">Lists</span>
<a class="title-close" href="/admin" aria-label="Close"><span class="w95-close" aria-hidden="true"></span></a>
</div>
<div class="w95-body">
<div id="tabs" class="tabs" role="tablist" aria-label="Lists"></div>
<div id="panel" class="panel" role="tabpanel" hidden>
<form id="add-form" class="add-row">
<input id="item-input" class="w95-input" type="text" maxlength="200" placeholder="Add an item..." enterkeyhint="done" aria-label="New item">
<button type="submit" id="item-add" class="w95-btn default">Add</button>
<button type="button" id="list-options" class="w95-btn gear" aria-label="List options" title="List options"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="#000" fill-rule="evenodd" d="M7 1h2l.4 1.8 1.2.5 1.6-1 1.4 1.4-1 1.6.5 1.2L15 7v2l-1.8.4-.5 1.2 1 1.6-1.4 1.4-1.6-1-1.2.5L9 15H7l-.4-1.8-1.2-.5-1.6 1-1.4-1.4 1-1.6-.5-1.2L1 9V7l1.8-.4.5-1.2-1-1.6 1.4-1.4 1.6 1 1.2-.5zM8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z"/></svg></button>
</form>
<ul id="items" class="items"></ul>
<p id="items-empty" class="items-empty" hidden>Nothing on this list yet.</p>
<button type="button" id="clear-done" class="w95-btn clear-done" hidden>Clear done</button>
</div>
<p id="lists-empty" class="empty w95-sunken" hidden>No lists yet. Tap + to make one.</p>
<div id="lists-error" class="empty w95-sunken" role="alert" hidden>
<p class="error">Could not load the lists.</p>
<button type="button" id="lists-retry" class="w95-btn">Try Again</button>
</div>
</div>
<div class="w95-statusbar" role="status">
<span id="list-count">0 lists</span>
<span id="display-state">Display ...</span>
</div>
</main>

<div id="list-dialog" class="modal" hidden>
<div id="list-backdrop" class="modal-backdrop"></div>
<form id="list-form" class="w95-window dialog" role="dialog" aria-modal="true" aria-labelledby="list-title">
<div class="w95-titlebar">
<span id="list-title" class="w95-title-text">List options</span>
<button type="button" id="list-close" class="title-close" aria-label="Close"><span class="w95-close" aria-hidden="true"></span></button>
</div>
<div class="w95-body">
<div class="form">
<label for="list-name">Name</label>
<input id="list-name" class="w95-input" type="text" maxlength="60" enterkeyhint="done" autocomplete="off">
<span id="kind-label">Type</span>
<div class="choices" role="radiogroup" aria-labelledby="kind-label">
<label class="w95-check w95-radio"><input type="radio" name="kind" value="checklist"> Checklist</label>
<label class="w95-check w95-radio"><input type="radio" name="kind" value="notes"> Notes</label>
</div>
<label class="w95-check full"><input id="list-tv-open" type="checkbox"><span>Open on the TV</span></label>
</div>
<div class="buttons">
<button type="button" id="delete-list" class="w95-btn del">Delete list</button>
<button type="submit" id="list-save" class="w95-btn default">Save</button>
<button type="button" id="list-cancel" class="w95-btn">Cancel</button>
</div>
</div>
</form>
</div>

<div id="name-dialog" class="modal" hidden>
<div id="name-backdrop" class="modal-backdrop"></div>
<form id="name-form" class="w95-window dialog" role="dialog" aria-modal="true" aria-labelledby="name-title">
<div class="w95-titlebar">
<span id="name-title" class="w95-title-text">New list</span>
<button type="button" id="name-close" class="title-close" aria-label="Close"><span class="w95-close" aria-hidden="true"></span></button>
</div>
<div class="w95-body">
<label class="field-label" for="name-input">Name:</label>
<input id="name-input" class="w95-input" type="text" maxlength="60" enterkeyhint="done">
<div class="buttons">
<button type="submit" id="name-save" class="w95-btn default">OK</button>
<button type="button" id="name-cancel" class="w95-btn">Cancel</button>
</div>
</div>
</form>
</div>

<div id="delete-dialog" class="modal" hidden>
<div id="delete-backdrop" class="modal-backdrop"></div>
<div class="w95-window dialog" role="dialog" aria-modal="true" aria-labelledby="delete-title">
<div class="w95-titlebar">
<span id="delete-title" class="w95-title-text">Delete list</span>
<button type="button" id="delete-close" class="title-close" aria-label="Close"><span class="w95-close" aria-hidden="true"></span></button>
</div>
<div class="w95-body">
<div class="confirm">
<svg class="confirm-icon" viewBox="0 0 32 32" aria-hidden="true"><polygon points="16,2 31,29 1,29" fill="#000"/><polygon points="16,5 28,27 4,27" fill="#ffff00"/><rect x="14.5" y="11" width="3" height="9" fill="#000"/><rect x="14.5" y="22" width="3" height="3" fill="#000"/></svg>
<p id="delete-text">Delete this list and everything on it?</p>
</div>
<div class="buttons">
<button type="button" id="confirm-delete" class="w95-btn default">Delete</button>
<button type="button" id="confirm-cancel" class="w95-btn">Cancel</button>
</div>
</div>
</div>
</div>
<div id="item-dialog" class="modal" hidden>
<div id="item-backdrop" class="modal-backdrop"></div>
<div class="w95-window dialog" role="dialog" aria-modal="true" aria-labelledby="item-title">
<div class="w95-titlebar">
<span id="item-title" class="w95-title-text">Item</span>
<button type="button" id="item-close" class="title-close" aria-label="Close"><span class="w95-close" aria-hidden="true"></span></button>
</div>
<form id="item-edit" class="w95-body">
<label class="field-label" for="item-text">Text:</label>
<input id="item-text" class="w95-input" type="text" maxlength="200" enterkeyhint="done">
<div class="checks">
<label id="item-done-row" class="w95-check"><input id="item-done" type="checkbox"><span>Done</span></label>
<label class="w95-check"><input id="item-pinned" type="checkbox"><span>Pinned</span></label>
</div>
<div class="buttons">
<button type="submit" id="item-save" class="w95-btn default">Save</button>
<button type="button" id="item-cancel" class="w95-btn">Cancel</button>
<button type="button" id="item-delete" class="w95-btn">Delete</button>
</div>
</form>
<div id="item-confirm" class="w95-body" hidden>
<div class="confirm">
<svg class="confirm-icon" viewBox="0 0 32 32" aria-hidden="true"><polygon points="16,2 31,29 1,29" fill="#000"/><polygon points="16,5 28,27 4,27" fill="#ffff00"/><rect x="14.5" y="11" width="3" height="9" fill="#000"/><rect x="14.5" y="22" width="3" height="3" fill="#000"/></svg>
<p>Delete this item?</p>
</div>
<div class="buttons">
<button type="button" id="item-confirm-delete" class="w95-btn default">Delete</button>
<button type="button" id="item-confirm-cancel" class="w95-btn">Cancel</button>
</div>
</div>
</div>
</div>
<script src="{{ static_url('lists.js') }}"></script>
</body>
</html>
