<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Home Board</title>
<link rel="stylesheet" href="{{ static_url('win95.css') }}">
<link rel="stylesheet" href="{{ static_url('tv.css') }}">
</head>
<body class="w95-desktop tv">
<main class="w95-window">
<div class="w95-titlebar">
<span id="title" class="w95-title-text">Home Board</span>
<span id="clock" class="tv-clock"></span>
</div>
<div class="tv-track">
<div id="screen" class="w95-body tv-screen"></div>
</div>
<div class="w95-statusbar">
<span id="screen-count"></span>
<span id="today"></span>
</div>
</main>
<div id="day-dialog" class="modal" hidden>
<div id="day-backdrop" class="modal-backdrop"></div>
<div class="w95-window dialog tv-day" role="dialog" aria-modal="true" aria-labelledby="day-title">
<div class="w95-titlebar">
<span id="day-title" class="w95-title-text"></span>
<button type="button" id="day-close" class="title-close" aria-label="Close"><span class="w95-close" aria-hidden="true"></span></button>
</div>
<ul id="day-list" class="w95-body tv-day-list"></ul>
</div>
</div>
<script src="{{ static_url('calendar_util.js') }}"></script>
<script src="{{ static_url('tv_screen.js') }}"></script>
</body>
</html>
