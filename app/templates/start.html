<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#008080">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Home Board">
<title>Home Board</title>
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icon-512.png">
<link rel="icon" type="image/png" href="/static/icon-512.png">
<link rel="stylesheet" href="{{ static_url('win95.css') }}">
</head>
<body class="w95-desktop">
<main class="w95-window">
<div class="w95-titlebar">
<span class="w95-title-text">Home Board</span>
<span class="w95-close" aria-hidden="true"></span>
</div>
<div class="w95-body">
<section class="w95-group" aria-labelledby="group-board">
<h2 id="group-board" class="w95-legend">Board</h2>
<ul class="w95-icons">
<li><a class="w95-icon" href="/admin/photos">
<svg class="w95-icon-img" viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="5" width="28" height="22" fill="#000"/><rect x="3" y="6" width="26" height="20" fill="#c0c0c0"/><rect x="5" y="8" width="22" height="16" fill="#00ffff"/><polygon points="5,24 13,14 19,21 22,18 27,24" fill="#008000"/><rect x="21" y="10" width="4" height="4" fill="#ffff00"/></svg>
<span class="w95-icon-label">Photos</span>
</a></li>
<li><a class="w95-icon" href="/admin/calendar">
<svg class="w95-icon-img" viewBox="0 0 32 32" aria-hidden="true"><rect x="4" y="5" width="24" height="24" fill="#000"/><rect x="5" y="6" width="22" height="22" fill="#fff"/><rect x="5" y="6" width="22" height="6" fill="#800000"/><rect x="8" y="3" width="2" height="6" fill="#000"/><rect x="22" y="3" width="2" height="6" fill="#000"/><g fill="#000"><rect x="8" y="15" width="3" height="3"/><rect x="14" y="15" width="3" height="3"/><rect x="20" y="15" width="3" height="3"/><rect x="8" y="21" width="3" height="3"/><rect x="14" y="21" width="3" height="3"/></g></svg>
<span class="w95-icon-label">Calendar</span>
</a></li>
<li><a class="w95-icon" href="/admin/lists">
<svg class="w95-icon-img" viewBox="0 0 32 32" aria-hidden="true"><rect x="6" y="3" width="20" height="26" fill="#000"/><rect x="7" y="4" width="18" height="24" fill="#ffff80"/><g fill="#000080"><rect x="9" y="8" width="14" height="1"/><rect x="9" y="12" width="14" height="1"/><rect x="9" y="16" width="14" height="1"/><rect x="9" y="20" width="10" height="1"/></g></svg>
<span class="w95-icon-label">Lists</span>
</a></li>
</ul>
</section>
<section class="w95-group" aria-labelledby="group-channel">
<h2 id="group-channel" class="w95-legend">TV channel</h2>
<div class="w95-row">
<span>Showing on the TV:</span>
<span id="tv-stops" class="w95-seg">
<button class="w95-btn" type="button" data-channel="photos" aria-pressed="false">Photos</button>
<button class="w95-btn" type="button" data-channel="calendar" aria-pressed="false">Calendar</button>
<button id="screens-edit" class="w95-btn" type="button" aria-pressed="false">Edit</button>
</span>
</div>
<div class="w95-row">
<label for="channel-timeout">Back to Photos after</label>
<select id="channel-timeout" class="w95-input">
<option value="0">Never</option>
<option value="2">2 minutes</option>
<option value="5" selected>5 minutes</option>
<option value="10">10 minutes</option>
<option value="30">30 minutes</option>
</select>
<span class="w95-note">of no touches on the TV and no edits from a phone</span>
</div>
</section>
<p class="w95-footlink"><a href="/admin/about">About this board...</a></p>
</div>
<div class="w95-statusbar" role="status">
<span id="photo-count">Photos: ...</span>
<span id="display-state">Display ...</span>
</div>
</main>

<div id="name-dialog" class="modal" hidden>
<div id="name-backdrop" class="modal-backdrop"></div>
<form id="name-form" class="w95-window dialog" role="dialog" aria-modal="true" aria-labelledby="name-title">
<div class="w95-titlebar">
<span id="name-title" class="w95-title-text">Rename</span>
<button type="button" id="name-close" class="title-close" aria-label="Close"><span class="w95-close" aria-hidden="true"></span></button>
</div>
<div class="w95-body">
<label class="field-label" for="name-input">Name:</label>
<input id="name-input" class="w95-input" type="text" maxlength="60" enterkeyhint="done" autocomplete="off">
<p id="name-error" class="w95-note" role="alert" hidden>Could not save the name. Try again.</p>
<div class="buttons">
<button type="submit" id="name-save" class="w95-btn default">OK</button>
<button type="button" id="name-cancel" class="w95-btn">Cancel</button>
</div>
</div>
</form>
</div>
<script src="{{ static_url('start.js') }}"></script>
</body>
</html>
