<!doctype html>
<html lang="en" class="splash-ground">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>homeboard</title>
<link rel="stylesheet" href="{{ static_url('display.css') }}">
{% set boot = splash() %}
<style>{{ boot.css | safe }}</style>
</head>
<body>
<img id="layer-a" class="layer" alt=""{% if empty %} hidden{% endif %}>
<img id="layer-b" class="layer" alt=""{% if empty %} hidden{% endif %}>
{% if empty %}
<div id="empty">
<div class="name">homeboard</div>
<div class="qr">{{ qr_svg | safe }}</div>
<div class="url">{{ admin_url }}</div>
{% if ip_url %}<div class="url ip">{{ ip_url }}</div>{% endif %}
</div>
{% endif %}
<div id="overlay">
<div id="cell-top-left" class="cell row-top col-left"></div>
<div id="cell-top-center" class="cell row-top col-center"></div>
<div id="cell-top-right" class="cell row-top col-right"></div>
<div id="cell-middle-left" class="cell row-middle col-left"></div>
<div id="cell-middle-center" class="cell row-middle col-center"></div>
<div id="cell-middle-right" class="cell row-middle col-right"></div>
<div id="cell-bottom-left" class="cell row-bottom col-left"><div id="caption"></div></div>
<div id="cell-bottom-center" class="cell row-bottom col-center"></div>
<div id="cell-bottom-right" class="cell row-bottom col-right"><div id="clock"></div><div id="date"></div></div>
</div>
<iframe id="channel" title="TV channel"></iframe>
<div id="dim"></div>
<div id="brightness"></div>
<div id="edge"></div>
<div id="splash" class="splash">{{ boot.markup | safe }}</div>
<script src="{{ static_url('display.js') }}"></script>
</body>
</html>
