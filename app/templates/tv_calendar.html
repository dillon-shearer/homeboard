<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Calendar - Home Board</title>
<link rel="stylesheet" href="{{ static_url('win95.css') }}">
<link rel="stylesheet" href="{{ static_url('tv.css') }}">
</head>
<body class="w95-desktop tv">
<main class="w95-window">
<div class="w95-titlebar">
<span id="month-title" class="w95-title-text"></span>
<span id="clock" class="tv-clock"></span>
</div>
<div class="w95-body tv-cal">
<div id="cal-grid" class="tv-cal-grid"></div>
<section class="tv-card tv-up">
<h2>Coming up</h2>
<ul id="upcoming"></ul>
</section>
</div>
<div class="w95-statusbar">
<span id="month-count">0 events this month</span>
<span id="today"></span>
</div>
</main>
<script src="{{ static_url('calendar_util.js') }}"></script>
<script src="{{ static_url('tv_calendar.js') }}"></script>
</body>
</html>
