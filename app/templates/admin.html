<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Home Board">
<title>Home Board</title>
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icon-512.png">
<link rel="icon" type="image/png" href="/static/icon-512.png">
<link rel="stylesheet" href="{{ static_url('win95.css') }}">
<link rel="stylesheet" href="{{ static_url('admin.css') }}">
</head>
<body>
<div class="w95-titlebar">
<a class="w95-back" href="/admin">Start</a>
<span class="w95-title-text">Photos - Home Board</span>
<span class="w95-close" aria-hidden="true"></span>
</div>
<div id="toast" class="toast" role="alert" hidden></div>
<main>
<header class="top">
<h1>Home Board</h1>
<p class="meta"><span id="photo-count">0 photos</span><span id="offline" class="offline" hidden>Display offline</span></p>
</header>

<section class="upload">
<label class="upload-btn">
<input id="file-input" type="file" accept="image/jpeg,image/png,image/heic,image/heif,image/webp" multiple>
<span>Add Photos</span>
</label>
<ul id="upload-list" class="group upload-list" hidden></ul>
</section>

<section class="photos">
<div class="section-head">
<h2>Photos</h2>
<span class="hint">Tap a photo for options</span>
</div>
<div id="grid" class="grid"></div>
<p id="grid-empty" class="empty" hidden>No photos yet. Tap Add Photos to start.</p>
<button type="button" id="show-more" class="more" hidden>Show More</button>
</section>

<section class="settings">
<h2>Slideshow</h2>
<div class="group">
<div class="row">
<span class="label">Seconds per photo</span>
<div class="stepper">
<button type="button" id="interval-minus" aria-label="Less time">&minus;</button>
<input id="interval" type="number" min="5" max="600" step="1" inputmode="numeric" aria-label="Seconds per photo">
<button type="button" id="interval-plus" aria-label="More time">+</button>
</div>
</div>
<div class="row">
<span class="label">Fit</span>
<div class="seg" data-key="fit"><button type="button" data-value="contain">Contain</button><button type="button" data-value="cover">Cover</button></div>
</div>
<div class="row">
<span class="label">Transition</span>
<button type="button" class="switch" role="switch" data-key="transition" aria-label="Transition"></button>
</div>
<div class="row">
<span class="label">Shuffle</span>
<button type="button" class="switch" role="switch" data-key="shuffle" aria-label="Shuffle"></button>
</div>
<div class="row">
<span class="label">Captions</span>
<button type="button" class="switch" role="switch" data-key="captions" aria-label="Captions"></button>
</div>
</div>
<p id="settings-error" class="error" hidden></p>
</section>

</main>
<div id="sheet" class="sheet" hidden>
<div id="sheet-backdrop" class="sheet-backdrop"></div>
<div class="sheet-panel" role="dialog" aria-modal="true" aria-label="Photo options">
<div id="sheet-actions" class="sheet-list">
<div class="sheet-group">
<img id="sheet-thumb" class="sheet-thumb" alt="">
<button type="button" id="sheet-edit">Edit Caption</button>
<button type="button" id="sheet-toggle">Hide from Board</button>
<button type="button" id="sheet-delete" class="danger">Delete Photo</button>
</div>
<button type="button" id="sheet-cancel" class="cancel">Cancel</button>
</div>
<div id="sheet-confirm" class="sheet-list" hidden>
<div class="sheet-group">
<p class="sheet-title">This photo will be removed from the board and the Pi.</p>
<button type="button" id="confirm-delete" class="danger">Delete Photo</button>
</div>
<button type="button" id="confirm-cancel" class="cancel">Cancel</button>
</div>
<div id="sheet-caption" class="sheet-list" hidden>
<div class="sheet-group pad">
<input id="caption-input" type="text" placeholder="Caption" aria-label="Caption" enterkeyhint="done">
</div>
<div class="sheet-row">
<button type="button" id="caption-cancel" class="cancel">Cancel</button>
<button type="button" id="caption-save" class="primary">Save</button>
</div>
</div>
</div>
</div>
<script src="{{ static_url('admin.js') }}"></script>
</body>
</html>
